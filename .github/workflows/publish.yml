name: Publish to PyPI

# Trusted publishing (OIDC): requires the owner-side pending-publisher
# registration on pypi.org — project name `parsanol`, owner `parsanol`,
# repository `parsanol-python`, workflow `publish.yml`. No API token.
#
# Wheels only: the sdist would carry no engine (the Rust sources are a
# submodule of this repo, not of the archive), so a source install could
# never load libparsanol. Each platform wheel VENDORS the cdylib built
# from the pinned parsanol-rs submodule; wheels.yml stages it and tags the
# wheel with its real platform.
#
# The audit job is the honesty leg: it installs the PUBLISHED release from
# PyPI (not the local tree) on every platform and replays the conformance
# corpus through it. A wheel that loses its vendored binary, or drifts
# from the corpus, fails here instead of in a consumer's bundle.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml

  publish:
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  audit:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the PUBLISHED release from PyPI
        shell: bash
        # The CDN can lag the upload by a few seconds; retry, do not fail
        # on the first 404.
        run: |
          for attempt in $(seq 1 12); do
            python3 -m pip install --upgrade --no-cache-dir parsanol pytest && break
            echo "attempt $attempt: not visible yet; retrying"
            sleep 15
          done
      - name: The installed version is this commit's version
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.metadata as m
          import pathlib
          import re
          want = re.search(
              r'^version = "([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(),
              re.M,
          ).group(1)
          got = m.version("parsanol")
          assert got == want, f"PyPI served {got}, this commit is {want}"
          import parsanol
          assert parsanol.__version__ == want, (
              f"parsanol.__version__ is {parsanol.__version__}, expected {want}"
          )
          print("audited parsanol", got)
          PY
      - name: Replay the conformance corpus through the published wheel
        shell: bash
        env:
          PARSANOL_CORPUS_DIR: ${{ github.workspace }}/parsanol-rs/corpus/conformance
        run: python3 -m pytest tests -q
