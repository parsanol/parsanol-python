name: Publish to PyPI

# Trusted publishing (OIDC): requires the owner-side pending-publisher
# registration on pypi.org — project name `parsanol`, owner `parsanol`,
# repository `parsanol-python`, workflow `publish.yml`. No API token.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the sdist and the wheels
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
