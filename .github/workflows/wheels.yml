name: Wheels

# Builds release wheels for the supported platforms and uploads them as
# workflow artifacts. PUBLISHING to PyPI is a separate, owner-gated step
# (docs/tickets/0001-packaging.md): the package name, the Python floor, and
# the cadence are owner decisions, and PyPI trusted publishing requires the
# owner-side project registration first.
#
# The package is pure Python with a VENDORED cdylib, so setuptools tags the
# wheel `py3-none-any`. That tag is wrong: each wheel carries one OS's
# binary. Every wheel is retagged with its real platform
# (`manylinux_*`/`macosx_*`/`win_amd64`) before it is smoke-tested or
# uploaded — otherwise the three OS builds would be indistinguishable
# `py3-none-any` files and PyPI would reject the second one.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/wheels.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            lib: libparsanol.so
            platform_tag: manylinux_2_35_x86_64
          - os: macos-14
            lib: libparsanol.dylib
            platform_tag: macosx_11_0_arm64
          - os: windows-2022
            lib: parsanol.dll
            platform_tag: win_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the cdylib
        run: cargo build -p parsanol-ffi --release
        working-directory: parsanol-rs
      - name: Stage the vendored engine
        shell: bash
        run: |
          mkdir -p src/parsanol/lib
          cp "parsanol-rs/target/release/${{ matrix.lib }}" "src/parsanol/lib/${{ matrix.lib }}"
      - name: Build the wheel
        run: |
          python3 -m pip install -U pip wheel
          python3 -m pip wheel . --no-deps -w dist
      - name: Tag the wheel with its platform
        shell: bash
        run: |
          python3 -m wheel tags --remove --python-tag py3 --abi-tag none \
            --platform-tag "${{ matrix.platform_tag }}" dist/*.whl
      - name: Smoke the wheel
        shell: bash
        run: |
          python3 -m pip install dist/*.whl pytest
          PARSANOL_CORPUS_DIR="$GITHUB_WORKSPACE/parsanol-rs/corpus/conformance" \
            python3 -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
